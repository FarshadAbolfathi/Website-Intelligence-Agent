# Disposable WordPress used only by tests/wordpress/run.sh. The database lives in tmpfs and nothing persists.
name: wia-wptest

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: wia-test-only
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wia-test-only
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 5s
      retries: 40

  wp:
    image: wordpress:latest
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8090:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wia-test-only
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', '/tmp/wp-debug.log');
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_files:/var/www/html

  cli:
    image: wordpress:cli
    user: "33:33"
    depends_on:
      db: { condition: service_healthy }
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wia-test-only
      WORDPRESS_DB_NAME: wp
      HOME: /tmp
    volumes:
      - wp_files:/var/www/html
      - ../../../dist:/plugin:ro
      - ../../../tests/wordpress:/tests:ro
      - ../../../shared:/shared:ro
    entrypoint: ["sleep", "infinity"]

volumes:
  wp_files: {}
